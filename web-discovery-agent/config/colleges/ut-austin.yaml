id: ut-austin
name: The University of Texas at Austin
timezone: America/Chicago

# Approximate campus center. VERIFY before using for geocoder biasing / distance checks.
campus_lat: 30.2849
campus_lng: -97.7341

# Sonar allowlist (max 20, allowlist mode only: no "-" prefixes).
# Only domains a college would recognize as its own official channels.
# Tune after reviewing which sources actually produce good candidates.
allowed_domains:
  - calendar.utexas.edu        # Texas Today (official campus calendar, Localist)
  - utexas.campuslabs.com      # HornsLink (student orgs). May be renamed/replaced; re-check.
  - studentlife.utexas.edu
  - recsports.utexas.edu
  - utexas.edu                 # catch-all for departments; remove if results get noisy

# Optional hints added to the prompt so Sonar knows where to look.
source_hints:
  - "Texas Today (calendar.utexas.edu), the official UT events calendar"
  - "HornsLink (utexas.campuslabs.com), the student organization platform"

model: sonar                   # try sonar-pro if recall is poor
search_context_size: medium    # low | medium | high (cost vs. recall)
pub_lookback_days: 30          # search filters use PUBLICATION date, not event date

# Direct calendar feeds (free, no AI needed). Texas Today runs on Localist, which
# can export ICS/RSS. Open calendar.utexas.edu, find the subscribe / "add to calendar"
# link (ideally filtered to free events), and paste the .ics URL here.
feed_urls: []
#  - https://calendar.utexas.edu/PASTE-REAL-ICS-URL-HERE.ics
